# Local PostgreSQL for development and tests:  docker compose up -d
#   app database:   postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
#   test database:  postgresql://wardrobe:wardrobe@localhost:5432/wardrobe_test
# These credentials are for a local development database only — use your own in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: wardrobe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
      TZ: Asia/Tashkent
    ports:
      - "5432:5432"
    volumes:
      - wardrobe-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wardrobe-postgres:
